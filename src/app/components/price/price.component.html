<section id="comprar-agora">
    <div>
        <h1>eBook Kindle</h1>
        <img src="ebook.svg" alt="Preço do eBook" />
        <p-button [rounded]="true" (onClick)="comprarKindle()">
            Comprar na Amazon
        </p-button>
    </div>
    <div>
        <h1>Capa dura</h1>
        <img src="hardcover.svg" alt="Preço do capa dura" />
        <p-button [rounded]="true" (onClick)="comprarCapaDura()">
            Comprar na Amazon
        </p-button>
    </div>
</section>
