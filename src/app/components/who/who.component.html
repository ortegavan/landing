<section class="who container">
    <div>
        <h1>{{ title }}</h1>
        <ng-content></ng-content>
    </div>
    <div>
        <img
            [src]="image"
            [alt]="title"
            [attr.width]="imageSize"
            [attr.height]="imageSize"
            loading="lazy"
            decoding="async"
            [style]="'max-width: ' + imageSize + 'px'"
        />
    </div>
</section>
