<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta
            name="description"
            content="Angular na prática: aprenda a desenvolver uma aplicação completa com Angular, explorando os fundamentos e avançando até o domínio do framework. Perfeito para iniciantes e intermediários, este livro guia você na criação de uma rede social para receitas culinárias, passo a passo."
        />
        <title>Angular na prática :: Uma jornada do zero ao deploy</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" type="image/x-icon" href="favicon.ico" />

        <!-- Resource hints para melhorar performance -->
        <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
        <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <!-- Preload de recursos críticos (LCP) -->
        <link
            rel="preload"
            href="hero.svg"
            as="image"
            type="image/svg+xml"
            fetchpriority="high"
        />
        <link rel="preload" href="book.webp" as="image" type="image/webp" />

        <!-- Fontes otimizadas - apenas pesos necessários com display=swap -->
        <link
            href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
            rel="stylesheet"
            media="print"
            onload="this.media = 'all'"
        />
        <noscript>
            <link
                href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
                rel="stylesheet"
            />
        </noscript>

        <!-- Font Awesome carregado de forma assíncrona após DOMContentLoaded -->
        <link rel="preconnect" href="https://kit.fontawesome.com" crossorigin />
        <script>
            // Carregar Font Awesome após DOMContentLoaded para não bloquear renderização
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', loadFontAwesome);
            } else {
                loadFontAwesome();
            }
            function loadFontAwesome() {
                var script = document.createElement('script');
                script.src = 'https://kit.fontawesome.com/f6dfbc60f1.js';
                script.crossOrigin = 'anonymous';
                script.defer = true;
                document.head.appendChild(script);
            }
        </script>
    </head>
    <body>
        <app-root></app-root>
    </body>
</html>
